  <style>

    /* GLOBAL */
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0b0b0b; /* FLAT BLACK */
      color: #f2f2f2;
      text-align: center;
    }

    section, div[id] {
      scroll-margin-top: 90px;
    }

    h2 {
      color: #ff2a2a;
      margin-bottom: 15px;
    }

    p {
      max-width: 750px;
      margin: 0 auto 25px;
      font-size: 16px;
      line-height: 1.65;
    }

    /* NAV */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      border-bottom: 1px solid #b30000;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      gap: 26px;
    }

    .top-nav a {
      color: #d0d0d0;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.25s ease;
    }

    .top-nav a:hover {
      color: #ffffff;
    }

    /* HERO */
    header {
      padding: 60px 20px 50px;
      border-bottom: 3px solid #b30000;
      background-color: #0b0b0b;
    }

    .badge {
      width: 420px;
      max-width: 90%;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 38px;
      margin: 10px 0 0;
    }

    main {
      padding: 50px 20px;
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      padding: 16px 34px;
      background-color: #b30000;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      border: 2px solid black;
      transition: all 0.25s ease;
      margin: 10px;
    }

    .btn:hover {
      background-color: black;
      color: #ff2a2a;
      border-color: #b30000;
      transform: scale(1.05);
    }

    /* SECTION DIVIDER STYLE */
    .philosophy {
      margin-top: 70px;
      padding: 50px 20px;
      border-top: 2px solid #b30000;
      border-bottom: 2px solid #b30000;
    }

    /* PRICING */
    .pricing-section {
      margin-top: 70px;
      padding-top: 50px;
      border-top: 2px solid #b30000;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .price-card {
      background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
      border: 2px solid #b30000;
      border-radius: 14px;
      padding: 30px;
      text-align: left;
      box-shadow: 0 8px 20px rgba(179,0,0,0.45);
      transition: transform 0.3s ease;
    }

    .price-card:hover {
      transform: translateY(-6px);
    }

    .price-card h3 {
      color: #ff2a2a;
      text-align: center;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .price-card ul {
      list-style: none;
      padding: 0;
      font-size: 15px;
      line-height: 1.9;
    }

    /* CLINIC */
    .clinic {
      margin-top: 70px;
      padding-top: 50px;
      border-top: 2px solid #b30000;
    }

    .clinic-card {
      max-width: 420px;
      margin: 25px auto;
      padding: 30px;
      background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
      border: 2px solid #b30000;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(179,0,0,0.45);
    }

    .clinic-card h3 {
      color: #ff2a2a;
    }

    /* FOOTER */
    footer {
      background-color: black;
      padding: 20px;
      margin-top: 60px;
      border-top: 3px solid #b30000;
      font-size: 14px;
    }

  </style>
</head>
